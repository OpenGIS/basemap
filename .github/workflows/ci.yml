# Validates tests, generated app data and the static site build.
# Pages deploys master pushes through pages.yml, so this runs on pull requests
# only. The end-to-end suite installs Chromium; it does not deploy Pages or
# commit generated files.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check generated app data
        run: npm run palette:data:check

      - name: Build site
        run: npm run site:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
