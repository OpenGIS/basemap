<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basemap — demo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: fixed; inset: 0; }
    header {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      font-family: system-ui, sans-serif;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    header p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Basemap</h1>
    <p>OpenMapTiles OSM style · OpenFreeMap data</p>
  </header>
  <div id="map"></div>
  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.mjs';
    const styleUrl = new URLSearchParams(location.search).get('style') || './style.json';
    const map = new maplibregl.Map({
      container: 'map',
      style: styleUrl,
      center: [0, 20],
      zoom: 2
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
